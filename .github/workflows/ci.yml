name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run assets:check
      # The build main deploys, which refuses to carry anything from src/dev/.
      # Here, so a leak fails on the way into dev and not on the way out to prod.
      - name: Prod build carries no dev tools
        run: npx vite build
        env:
          BUILD_ENV: prod
      - run: npx vite build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
