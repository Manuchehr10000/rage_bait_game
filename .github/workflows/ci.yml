name: CI

# One workflow, two jobs. `check` runs on every push and pull request. `deploy`
# runs after it, only on a push to main or dev, and only if it passed: a red
# commit never reaches either link.
#
# One Cloudflare Pages project, two branches, two hostnames:
#   prod  https://losttourist.online       from main
#   dev   https://dev.losttourist.online   from dev
#
# Each branch deploys on its own and keeps its own history, so a push to dev
# never touches prod and either one can be rolled back alone. Both are served
# from the site root, so there is no base path to juggle.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run assets:check
      # The build main deploys, which refuses to carry anything from src/dev/.
      # Here, so a leak fails on the way into dev and not on the way out to prod.
      - name: Prod build carries no dev tools
        run: npx vite build
        env:
          BUILD_ENV: prod
      # No build here for the tests: Playwright makes its own, from this source, before it starts.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'dev')
    runs-on: ubuntu-latest
    # Queue per branch: a second push to dev supersedes the first, and never
    # cancels a prod deploy that happens to be in flight.
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` is typecheck, then the asset manifest check, then vite.
      # BUILD_ENV decides the footer stamp and which build is allowed to be
      # indexed; GITHUB_SHA is already in the environment and stamps the commit.
      - name: Build
        env:
          BUILD_ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
        run: npm run build

      # wrangler reports every failure on the upload-token endpoint as
      # "Authentication error [code: 10000]", whether the token is missing the
      # Pages permission or the project simply is not there. Ask Cloudflare both
      # questions first, so a failed deploy says which one it was. Nothing here
      # prints the token or the account id.
      - name: Check the Cloudflare token can see the project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api() { curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }

          verify=$(api /user/tokens/verify)
          echo "token verify: HTTP $(echo "$verify" | tail -1)"

          projects=$(api "/accounts/$CF_ACCOUNT/pages/projects")
          code=$(echo "$projects" | tail -1)
          echo "list Pages projects: HTTP $code"

          if [ "$code" != "200" ]; then
            echo "::error::The token cannot list Pages projects on this account. Give it Account → Cloudflare Pages → Edit at https://dash.cloudflare.com/profile/api-tokens"
            echo "$projects" | head -n -1 | head -c 600
            exit 1
          fi

          names=$(echo "$projects" | head -n -1 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).result.map(p=>p.name).join(" ")))')
          echo "projects on this account: ${names:-(none)}"
          case " $names " in
            *" lost-tourist "*) ;;
            *)
              echo "::error::No Pages project called lost-tourist. Create one (Workers & Pages → Create → Pages → Direct Upload) and attach losttourist.online and dev.losttourist.online to it."
              exit 1
              ;;
          esac

          # A Pages project connected to a git repo refuses direct uploads, and
          # says so with the same code 10000 as a token without permission. Read
          # the project and let it say which kind it is.
          project=$(api "/accounts/$CF_ACCOUNT/pages/projects/lost-tourist")
          echo "$project" | head -n -1 | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s).result||{};console.log("project source:",p.source?JSON.stringify(p.source.type):"(none — direct upload)");console.log("production branch:",p.production_branch);console.log("domains:",(p.domains||[]).join(" ")||"(none)")})' || echo "could not read the project"

          # Listing projects only needs Pages Read. The deploy needs Pages Edit,
          # and the two are a permission apart, so ask for the thing the deploy
          # actually asks for and print what Cloudflare says when it says no.
          token=$(api "/accounts/$CF_ACCOUNT/pages/projects/lost-tourist/upload-token")
          code=$(echo "$token" | tail -1)
          echo "request an upload token (needs Pages Edit): HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Cloudflare said:"
            echo "$token" | head -n -1 | head -c 800
            echo
            echo "::error::The token can read this account's Pages projects but cannot get an upload token for one. A 403 here means it has Cloudflare Pages: Read where it needs Edit — fix that at https://dash.cloudflare.com/profile/api-tokens and put the new value in CLOUDFLARE_API_TOKEN."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=lost-tourist --branch=${{ github.ref_name }}

      - name: Say where it went
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "prod → https://losttourist.online" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "dev → https://dev.losttourist.online" >> "$GITHUB_STEP_SUMMARY"
          fi
