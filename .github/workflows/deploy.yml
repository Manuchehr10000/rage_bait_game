name: Deploy

# One GitHub Pages site serves both environments:
#   prod  https://manuchehr10000.github.io/rage_bait_game/       from main
#   dev   https://manuchehr10000.github.io/rage_bait_game/dev/   from dev
# Pages holds a single artifact, so every deploy rebuilds both branches.

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: prod
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build prod (main)
        working-directory: prod
        env:
          BUILD_ENV: prod
          GITHUB_SHA: ${{ github.sha }}
        run: |
          npm ci
          npx tsc --noEmit
          GITHUB_SHA="$(git rev-parse HEAD)" npx vite build --base=/rage_bait_game/

      - name: Build dev (dev)
        working-directory: dev
        env:
          BUILD_ENV: dev
        run: |
          npm ci
          npx tsc --noEmit
          GITHUB_SHA="$(git rev-parse HEAD)" npx vite build --base=/rage_bait_game/dev/

      - name: Assemble site
        run: |
          mkdir -p site/dev
          cp -r prod/dist/. site/
          cp -r dev/dist/. site/dev/
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
